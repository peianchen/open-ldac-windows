name: Offline codec and protocol
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline-core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tests/kernel/audit_low_resource.py
      - if: runner.os == 'Windows'
        run: python tests/integration.py build/Release/wldac_cli.exe
      - if: runner.os == 'Windows'
        run: python tests/player_cli.py build/Release/wldac_player.exe
      - if: runner.os != 'Windows'
        run: python tests/integration.py build/wldac_cli

  lifecycle-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-lifetime -DOL_LIFETIME_SANITIZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build-lifetime --target lifetime_tests native_adapter_tests avdtp_session_tests playback_tests wav_source_tests
      - run: ctest --test-dir build-lifetime -R "lifetime_tests|native_adapter_tests|avdtp_session_tests|playback_tests|wav_source_tests" --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
