name: Synthetic provider kernel lab (build only)
on:
  push:
    paths: ['driver/**', 'tests/kernel/**', 'include/native_transport.h', 'include/lifetime.h', 'src/lifetime.c', '.github/workflows/kernel-lab.yml']
  pull_request:
    paths: ['driver/**', 'tests/kernel/**', 'include/native_transport.h', 'include/lifetime.h', 'src/lifetime.c', '.github/workflows/kernel-lab.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-lab-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Restore pinned WDK
        run: nuget restore driver/packages.config -PackagesDirectory driver/.packages -NonInteractive
      - name: Build unsigned VM-only lab driver
        shell: pwsh
        run: |
          msbuild driver/OpenLdacKernelLab.vcxproj /m /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /p:RunCodeAnalysis=true /v:minimal 2>&1 | Tee-Object kernel-lab-build.log
          if ($LASTEXITCODE -ne 0) { throw 'Kernel lab build failed' }
          if (Select-String -LiteralPath kernel-lab-build.log -Pattern 'warning C\d{4}') { throw 'Kernel lab analysis warnings must be resolved' }
          $file = Get-Item 'build/kernel-lab/OpenLdacKernelLab.sys' -ErrorAction Stop
          @{ build_sha=$env:GITHUB_SHA; synthetic_provider=$true; unsigned_development=$true; driver_loaded=$false; kernel_verifier_run=$false; real_bluetooth_verified=$false; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash } |
            ConvertTo-Json | Set-Content build/kernel-lab/lab-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-lab-x64-UNSIGNED-SYNTHETIC-NOT-FOR-HOST
          path: |
            build/kernel-lab/OpenLdacKernelLab.sys
            build/kernel-lab/lab-manifest.json
          if-no-files-found: error
